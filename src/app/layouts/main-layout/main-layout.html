<!-- src/app/layouts/main-layout/main-layout.html -->
<div class="shell" [class.nav-open]="navOpen()" [class.collapsed]="collapsed()">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AM</div>
      <div class="brand-text">
        <div class="brand-name">{{ 'Asset Manager' | t }}</div>
        <!-- <div class="brand-sub">KINANA</div> -->
      </div>

      <button
        type="button"
        class="collapse-btn"
        (click)="toggleCollapsed()"
        [attr.aria-label]="(collapsed() ? 'Expand sidebar' : 'Collapse sidebar') | t"
        [attr.aria-expanded]="!collapsed()">
        {{ collapsed() ? '›' : '‹' }}
      </button>
    </div>

    <nav class="side-nav">
      @for (item of navItems(); track item.path) {
        
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeNav()" [attr.data-label]="item.label | t">
          <span class="ico">{{ item.icon }}</span>
          <span>{{ item.label | t }}</span>
          <!-- @if (item.adminOnly) {
            <span class="badge badge-admin" style="margin-left:auto">Admin</span>
          } -->
        </a>

      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="btn btn-ghost menu-btn"
        (click)="toggleNav()"
        [attr.aria-label]="(navOpen() ? 'Close menu' : 'Open menu') | t">☰</button>
      <span class="spacer"></span>
      <span class="welcome-text">{{ 'Welcome back, {name}' | t: { name: displayName() } }}</span>
      <app-preferences-toggle />
      <button type="button" class="btn btn-sm" (click)="signOut()">{{ 'Sign out' | t }}</button>


    </header>

    <router-outlet />
  </div>

  <div class="scrim" (click)="closeNav()"></div>
</div>
