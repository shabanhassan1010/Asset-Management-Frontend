<!-- src/app/layouts/main-layout/main-layout.html -->
<div class="shell" [class.nav-open]="navOpen()" [class.collapsed]="collapsed()">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AM</div>
      <div class="brand-text">
        <div class="brand-name">Asset Manager</div>
        <div class="brand-sub">KINANA</div>
      </div>

      <button
        type="button"
        class="collapse-btn"
        (click)="toggleCollapsed()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-expanded]="!collapsed()">
        {{ collapsed() ? '›' : '‹' }}
      </button>
    </div>

    <nav class="side-nav">
      @for (item of navItems(); track item.path) {
        
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeNav()" [attr.data-label]="item.label">
          <span class="ico">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <!-- @if (item.adminOnly) {
            <span class="badge badge-admin" style="margin-left:auto">Admin</span>
          } -->
        </a>

      }
    </nav>

    <div class="who">
      <div class="avatar">{{ initials() }}</div>
      <div class="who-text">
        <div class="who-name">{{ displayName() }}</div>
        <span class="badge" [class.badge-admin]="isAdmin()" [class.badge-user]="!isAdmin()">
          {{ roleLabel() }}
        </span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="btn btn-ghost menu-btn"
        (click)="toggleNav()"
        [attr.aria-label]="navOpen() ? 'Close menu' : 'Open menu'">☰</button>
      <span class="spacer"></span>
      <span class="welcome-text">Welcome back, {{ displayName() }}</span>
      <button type="button" class="btn btn-sm" (click)="signOut()">Sign out</button>
    </header>

    <router-outlet />
  </div>

  <div class="scrim" (click)="closeNav()"></div>
</div>
